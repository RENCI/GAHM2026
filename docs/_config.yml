title: GAHM2026
description: Generalized Asymmetric Holland Model for tropical cyclone wind and pressure fields
remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Pages are built from a staging directory assembled by tools/docs/build_docs.py,
# which copies this folder and adds the markdown rendered from documentation/*.docx.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/

search_enabled: true
search:
  heading_level: 3
  previews: 2
  rel_url: true

mermaid:
  version: "10.9.1"

heading_anchors: true

aux_links:
  GAHM2026 on GitHub:
    - https://github.com/RENCI/GAHM2026
aux_links_new_tab: true

# Extra entries in the main navigation.  just-the-docs builds the nav from page front
# matter, so a link to a section *inside* a page has to be listed here.  The theme
# renders these through `absolute_url`, which prepends the baseurl -- the WAF link
# therefore resolves both under the /GAHM2026 project prefix and in a local preview
# served from the site root.  `hide_icon` drops the external-link arrow, which would
# be misleading on a link that stays on the site.
nav_external_links:
  - title: Wind Adjustment Factor (WAF)
    url: /derivation/#5-wind-adjustment-factor-waf
    hide_icon: true
    opens_in_new_tab: false
  - title: IBTrACS (NCEI)
    url: https://www.ncei.noaa.gov/products/international-best-track-archive

back_to_top: true
back_to_top_text: Back to top

footer_content: >-
  Rick Luettich (UNC/IMS/CNHR/EMES) and Brian Blanton (UNC/RENCI).

last_edit_timestamp: false

color_scheme: light
