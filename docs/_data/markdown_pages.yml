# Manifest of markdown files elsewhere in the repository that are published to
# the site as-is.
#
# Use this for documentation that belongs next to the code it describes — the
# file stays where a developer browsing the repo will find it, and the site
# publishes the same copy, so the two cannot drift.  tools/docs/build_docs.py
# copies each one into the staging directory with the front matter below.  As
# with the docx-derived pages, the result is never committed.
#
#   source     path relative to the repository root
#   output     path of the generated page relative to the site root
#   title      nav and page title
#   nav_order  position in the sidebar
#   parent     title of the parent page, omit for top-level pages
#   permalink  optional explicit URL
#   strip_h1   drop a leading "# ..." heading, since the theme renders one from
#              the front matter title (default true)

- source: util/README.nws13.combine.md
  output: nws13.md
  title: NWS13 / NWS30 Output
  nav_order: 10
  permalink: /nws13/
